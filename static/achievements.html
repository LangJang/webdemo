<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成果展示 Achievements · SCS 海洋环境数据平台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="achievements">

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-cn">SCS 海洋环境数据平台</span>
        <span class="brand-en">South China Sea Marine Environmental Data Platform</span>
      </a>
      <nav class="main-nav">
        <a href="/" data-nav="home">首页</a>
        <a href="/database" data-nav="database">数据库</a>
        <a href="/upload" data-nav="upload">数据上传</a>
        <a href="/download" data-nav="download">数据下载</a>
        <a href="/achievements" data-nav="achievements">成果</a>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <h1 class="page-title">成果展示 Achievements</h1>
    <p class="page-sub">平台相关数据产品、图集与分析成果；点击卡片查看详情与下载。</p>

    <div class="masonry" id="ach-grid">
      <p class="empty-hint">加载中…</p>
    </div>
  </main>

  <div class="modal-backdrop" id="ach-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="ach-close" aria-label="关闭">×</button>
      <div id="ach-detail"></div>
    </div>
  </div>

  <footer class="app-footer">
    <span>数据来源 · 引用方式 · 联系方式 · v0.2 · 原型（占位符，后续接入真实管线）</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
